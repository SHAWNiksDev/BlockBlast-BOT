name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y adb ffmpeg tesseract-ocr tesseract-ocr-eng libegl1 libopengl0
      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt -r requirements-build.txt
      - name: Test source
        run: python -m unittest discover -s tests -q
      - name: Build Linux portable
        run: python scripts/build_linux.py
      - name: Test packaged desktop
        run: python scripts/check_bundle.py --bundle dist/BlockBlast-BOT-linux-x86_64
      - name: Package source
        run: python scripts/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlast-BOT-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_THREAD_LIMIT: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .build/windows-downloads
          key: windows-tools-${{ hashFiles('scripts/windows_tools.py') }}
      - name: Prepare native Windows tools
        run: python scripts/windows_tools.py
      - name: Use bundled tools for source tests
        shell: pwsh
        run: |
          foreach ($tool in @('adb', 'ffmpeg', 'tesseract')) {
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE ".build\windows-tools\bin\$tool")
          }
      - name: Check native ADB server and OCR version
        shell: pwsh
        run: |
          adb devices -l
          if ($LASTEXITCODE -ne 0) { throw 'ADB server did not start' }
          adb kill-server
          tesseract --version
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract did not start' }
      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt -r requirements-build.txt
      - name: Unit and regression tests on Windows
        run: python -m unittest discover -s tests -q
      - name: Build Windows portable
        run: python scripts/build_windows.py
      - name: Check EXE, native tools and Unicode relocation
        run: python scripts/check_bundle.py --bundle dist/BlockBlast-BOT-windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: BlockBlast-BOT-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: .build/bundle-reports
          if-no-files-found: ignore

  publish:
    needs: [linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BlockBlast-BOT-*
          merge-multiple: true
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION_TAG" release/*.tar.gz release/*.zip release/*.sha256 \
            --verify-tag --title "BlockBlast BOT $VERSION_TAG" \
            --notes-file docs/RELEASE_NOTES.md
