name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libegl1 libopengl0
      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -q
      - name: Desktop smoke test
        run: ./run-gui.sh --smoke-test /tmp/blockblast-ui.png
      - name: Compile modules
        run: python -m compileall -q blockblast tests scripts audit/reproduce.py
